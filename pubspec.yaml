name: quran_dub
description: "آية ستوديو (Ayah Studio) - يطابق أي فيديو تلاوة قرآنية مع نص القرآن والتفسير الميسر تلقائياً"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  # محرك التعرف على الصوت محلياً (k2-fsa، Apache-2.0) — يوم 4
  sherpa_onnx: ^2.0.3
  # SHA256 لملفات النموذج
  crypto: ^3.0.3
  # معاينة الفيديو (يوم 7). الرسمي من فريق Flutter (ExoPlayer على أندرويد).
  video_player: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # يوم 8: تجربة التصدير الحقيقي على محاكي أندرويد بالـ CI (export-e2e.yml).
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/quran_data.json.gz
  # خطوط الآية والتفسير (يوم 7) — الرخص بـ assets/fonts/LICENSES.md
  fonts:
    - family: KFGQPC Hafs
      fonts:
        - asset: assets/fonts/KFGQPC_HafsUthmanic_v18.ttf
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
