name: بناء APK تجريبي

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (غير قاطع مؤقتاً)
        run: flutter analyze || true

      - name: Tests (QuranMatcher + WAV/ASR helpers + pipeline + overlay)
        run: flutter test test/matching test/asr test/pipeline test/overlay

      # بس معالجات الجوالات الحقيقية (arm64 + arm 32-bit)، بدون x86_64 (محاكي).
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: APK size report (debug)
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          {
            echo "## حجم APK التجريبي (debug)"
            echo
            echo "**$(du -h "$apk" | cut -f1)** ($(stat -c %s "$apk") bytes)"
            echo
            aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
            echo '```'
            "$aapt2" dump badging "$apk" | grep -E "^package:|^application-label:|^uses-permission|^native-code|^sdkVersion" || true
            echo '```'
            echo
            echo "| ABI | native libs (compressed in APK) |"
            echo "|---|---|"
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              n=$(unzip -lv "$apk" "lib/$abi/*" 2>/dev/null | awk '$8 ~ /\.so$/ {c+=$3} END {printf "%.1f MB", c/1048576}')
              echo "| $abi | $n |"
            done
            echo
            echo '```'
            unzip -lv "$apk" 'lib/*' | awk '$8 ~ /\.so$/ {printf "%-55s %8.1f MB (raw %6.1f MB)\n", $8, $3/1048576, $1/1048576}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayah-studio-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # رابط تحميل مباشر وثابت لآخر نسخة تجريبية (بدون زد ولا فك ضغط): الـ
      # Artifact فوق بيرجع .zip دايماً (قيد GitHub)، أما أصل Release بيتحمّل
      # كملف APK خام تقدر تفتحه من إشعار التحميل على الجوال مباشرة. بس بعد
      # الدمج على main (مش لكل PR)، عشان الرابط يضل ثابت ومستقر.
      - name: نشر/تحديث رابط تحميل مباشر (آخر نسخة تجريبية على main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk ayah-studio-debug.apk
          title="آخر نسخة تجريبية (Run #${{ github.run_number }})"
          notes="رابط تحميل مباشر لآخر نسخة تجريبية (debug) من \`main\`.

          نزّل ملف \`ayah-studio-debug.apk\` من الأسفل على جوالك وافتحه من إشعار التحميل مباشرة لتثبيته — بدون فك أي ضغط. أول مرة بتحتاج تسمح بالتثبيت من مصدر غير معروف (Android رح يسألك لحاله).

          - Commit: \`${{ github.sha }}\`
          - Run: #${{ github.run_number }}"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest ayah-studio-debug.apk --clobber
            gh release edit debug-latest --title "$title" --notes "$notes"
          else
            gh release create debug-latest ayah-studio-debug.apk \
              --title "$title" --notes "$notes" --prerelease
          fi

      # حجم النسخة الحقيقية للمستخدم (release مقسومة حسب المعالج). مش قاطع.
      - name: Release APK sizes (--split-per-abi)
        continue-on-error: true
        run: |
          flutter build apk --release --split-per-abi
          {
            echo "## حجم APK النهائي (release، لكل معالج)"
            echo
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              echo "- $(basename "$f"): **$(du -h "$f" | cut -f1)**"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "نشر Release دائم للقطة هالمرحلة (day7)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk "AyahStudio-day7-debug.apk"
          if gh release view "day7-apk" >/dev/null 2>&1; then
            gh release upload "day7-apk" "AyahStudio-day7-debug.apk" --clobber
          else
            gh release create "day7-apk" "AyahStudio-day7-debug.apk" \
              --title "يوم 7 — عرض النص فوق الفيديو (معاينة)" --notes "الآية والتفسير صاروا يظهروا فوق الفيديو بالتصميم المطلوب (الخط العثماني، الأقواس الذهبية، تزامن مع الصوت، نص أبيض أو أسود حسب خلفية الفيديو). هاي معاينة جوا التطبيق بس، لسا بدون تصدير فيديو نهائي." --prerelease \
              --target "$GITHUB_SHA"
          fi
