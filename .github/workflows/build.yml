name: بناء APK تجريبي

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (غير قاطع مؤقتاً)
        run: flutter analyze || true

      - name: Matching tests (QuranMatcher)
        run: flutter test test/matching

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-dub-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: "نشر Release دائم للقطة هالمرحلة (day3)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk "AyahStudio-day3-debug.apk"
          if gh release view "day3-apk" >/dev/null 2>&1; then
            gh release upload "day3-apk" "AyahStudio-day3-debug.apk" --clobber
          else
            gh release create "day3-apk" "AyahStudio-day3-debug.apk" \
              --title "يوم 3 — خوارزمية المطابقة" --notes "انضافت خوارزمية مطابقة النص مع القرآن (بدون صوت حقيقي لسا). الشاشة الرئيسية فيها فحص ذاتي بيطبع نتيجة مطابقة 3 نصوص تجريبية." --prerelease \
              --target "$GITHUB_SHA"
          fi
