name: بناء APK تجريبي

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (غير قاطع مؤقتاً)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-dub-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: "نشر Release دائم للقطة هالمرحلة (day1)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk "AyahStudio-day1-debug.apk"
          if gh release view "day1-apk" >/dev/null 2>&1; then
            gh release upload "day1-apk" "AyahStudio-day1-debug.apk" --clobber
          else
            gh release create "day1-apk" "AyahStudio-day1-debug.apk" \
              --title "يوم 1 — الهيكلة الأولية" --notes "أول نسخة: مشروع Flutter فاضي تقريباً + شاشة ترحيبية بسيطة، بدون أي ميزة قرآن بعد (الهدف وقتها كان التأكد إنه CI وبناء APK شغّالين)." --prerelease \
              --target "9f00350fbdfe7c9ab817f5073ad1aeb9ba5e78b9"
          fi
