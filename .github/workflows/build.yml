name: بناء APK تجريبي

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (غير قاطع مؤقتاً)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-dub-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: "نشر Release دائم للقطة هالمرحلة (day2)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk "AyahStudio-day2-debug.apk"
          if gh release view "day2-apk" >/dev/null 2>&1; then
            gh release upload "day2-apk" "AyahStudio-day2-debug.apk" --clobber
          else
            gh release create "day2-apk" "AyahStudio-day2-debug.apk" \
              --title "يوم 2 — قاعدة بيانات القرآن" --notes "القرآن كامل (الرسم العثماني) والتفسير الميسر صاروا محمّلين جوا التطبيق. الشاشة الرئيسية بتعرض عدد السور والآيات وأول آية (الفاتحة) كتأكيد. ما في تسجيل ولا تحليل فيديو بعد." --prerelease \
              --target "4a3f3ea1ec0d8ac59c8adf12ec4e6577fd7d8b13"
          fi
