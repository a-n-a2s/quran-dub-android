name: تجربة التصدير على محاكي

# يوم 8: التصدير الحقيقي (Flutter → صور النص → Media3 Transformer → المعرض) على
# محاكي أندرويد 14، بمقاطع عمودي/أفقي/مربّع/مدوّر/أبعاد فردية/ملف تلاوة منفصل،
# ومقارنة إطارات الناتج مع (الأصل + صورة النص). الـ CI العادي (build.yml) ما
# بيقدر يرمّز فيديو، فهاد هو الفحص الوحيد للتصدير قبل جوال أنس.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "lib/export/**"
      - "lib/overlay/**"
      - "lib/screens/export_screen.dart"
      - "lib/platform/**"
      - "android/**"
      - "integration_test/**"
      - "tool/e2e/**"
      - "pubspec.yaml"
      - ".github/workflows/export-e2e.yml"
  push:
    branches: [ "main" ]
    paths:
      - "lib/export/**"
      - "lib/overlay/**"
      - "android/**"
      - "integration_test/**"
      - ".github/workflows/export-e2e.yml"
  workflow_dispatch: {}

jobs:
  export-e2e:
    name: Export on Android 14 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AYAH_KEEP_X86: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -1

      - name: مقاطع الاختبار
        run: bash tool/e2e/make_clips.sh build/e2e_clips

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Export e2e (emulator API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tool/e2e/run_export_e2e.sh build/e2e_clips build/e2e_out

      - name: ملخص
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "build/e2e_out/cases.jsonl"
          print("## تجربة التصدير على المحاكي\n")
          if not os.path.exists(p) or os.path.getsize(p) == 0:
              print("ما في نتائج (شوف flutter_test.log بالـ artifact).")
              raise SystemExit
          print("| الحالة | الأصل | الناتج | الوقت | MAE النص (≤30) | النص مقابل الأصل | برا الشريط | أول سطر (متوقع/ناتج) | مشاكل |")
          print("|---|---|---|---|---|---|---|---|---|")
          for line in open(p):
              line = line.strip()
              if not line: continue
              r = json.loads(line)
              fr = r.get("frames", [])
              full = [f for f in fr if f["alpha"] > 0.95]
              mt = max((f["maeText"] for f in full), default=-1)
              mv = min((f["maeTextVsSource"] for f in full), default=-1)
              mo = max((f["maeOutside"] for f in fr), default=-1)
              rows = ", ".join(f'{f["expectedFirstRow"]}/{f["outFirstRow"]}' for f in full)
              probs = "; ".join(r.get("problems", [])) or "✅"
              print(f'| {r["name"]} | {r.get("source","")} | {r.get("output","")} | {(r.get("elapsedMs") or 0)/1000:.1f}s | {mt:.1f} | {mv:.1f} | {mo:.1f} | {rows} | {probs[:300]} |')
          PY

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-e2e-${{ github.run_number }}
          path: build/e2e_out
          if-no-files-found: warn
          retention-days: 14
