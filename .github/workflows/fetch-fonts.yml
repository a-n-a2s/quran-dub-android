# مرة وحدة: بينزّل خطوط الواجهة (رخصة OFL) من google/fonts وبيعملها commit على
# نفس الفرع. الجلسة ما بتقدر تنزّل من raw.githubusercontent مباشرة.
name: تنزيل خطوط الواجهة
on:
  workflow_dispatch:
  push:
    branches: [redesign-ui]
    paths: [.github/workflows/fetch-fonts.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تنزيل
        run: |
          set -e
          mkdir -p assets/fonts/ui tool/logo/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          for w in Regular Medium SemiBold Bold; do
            curl -sSfL -o assets/fonts/ui/IBMPlexSansArabic-$w.ttf "$base/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf"
          done
          curl -sSfL -o assets/fonts/ui/OFL-IBMPlexSansArabic.txt "$base/ibmplexsansarabic/OFL.txt"
          # خطوط للشعار بس (بتتحوّل لمسارات SVG، ما بتنضمّن بالتطبيق)
          curl -sSfL -o tool/logo/fonts/Amiri-Bold.ttf "$base/amiri/Amiri-Bold.ttf"
          curl -sSfL -o tool/logo/fonts/ArefRuqaa-Bold.ttf "$base/arefruqaa/ArefRuqaa-Bold.ttf"
          curl -sSfL -o "tool/logo/fonts/ReemKufi.ttf" "$base/reemkufi/ReemKufi%5Bwght%5D.ttf" || true
          curl -sSfL -o tool/logo/fonts/Lalezar-Regular.ttf "$base/lalezar/Lalezar-Regular.ttf" || true
          curl -sSfL -o tool/logo/fonts/ElMessiri.ttf "$base/elmessiri/ElMessiri%5Bwght%5D.ttf" || true
          ls -la assets/fonts/ui tool/logo/fonts
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/ui tool/logo/fonts
          git commit -m "خطوط الواجهة IBM Plex Sans Arabic (OFL) + خطوط الشعار" || exit 0
          git push
